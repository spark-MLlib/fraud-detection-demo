#gradle代理
systemProp.http.proxyHost=shawguo.tpddns.cn
systemProp.http.proxyPort=11087
systemProp.https.proxyHost=shawguo.tpddns.cn
systemProp.https.proxyPort=11087
#超时设置，gradle提示配置项目不生效
systemProp.org.gradle.internal.http.connectionTimeout=60000  # 60秒
systemProp.org.gradle.internal.http.socketTimeout=60000  # 60秒
#增加提升gradle性能相关参数
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g